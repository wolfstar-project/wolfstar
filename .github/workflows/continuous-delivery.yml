name: Continuous Delivery

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'Dockerfile'
            - '.github/workflows/continuous-delivery.yml'
            - 'package.json'
permissions:
    contents: read
    packages: write

env:
    HUSKY: 0

jobs:
    publish:
        name: Publish WolfStar Latest image to GHCR
        uses: wolfstar-project/.github/.github/workflows/reusable-publish-image.yml@main
        secrets: inherit
