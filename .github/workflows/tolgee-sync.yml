name: Tolgee Translation Sync

on:
    workflow_dispatch:
    schedule:
        # Every day at 02:00 UTC
        - cron: '0 2 * * *'

concurrency:
    group: tolgee-sync
    cancel-in-progress: false

jobs:
    SyncTranslations:
        name: Sync translations from Tolgee
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout Project
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.WOLFSTAR_TOKEN }}
                  fetch-depth: 0
            - name: Install pnpm and Node.js v24
              uses: pnpm/setup@v2
              with:
                  runtime: node@24
                  cache: true
                  # Install is run explicitly below so it can skip lifecycle scripts
                  install: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Pull translations from Tolgee
              env:
                  TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
              # `pnpm tolgee:pull` runs the CLI (config: .tolgeerc.cjs) and then
              # scripts/tolgee-pull-remap.ts, which remaps Tolgee language tags
              # (es, pt, zh-Hans, …) onto the Discord locale directories.
              run: pnpm tolgee:pull
            - name: Commit any changes and create a pull request
              env:
                  GITHUB_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
              run: |
                  git add src/languages;
                  if git diff-index --quiet HEAD --; then
                    echo "No translation changes to commit, exiting with code 0"
                    exit 0;
                  else
                    git remote set-url origin "https://${GITHUB_TOKEN}:x-oauth-basic@github.com/${GITHUB_REPOSITORY}.git";
                    # Commit as the account behind WOLFSTAR_TOKEN
                    git config --local user.name "wolfstarbot";
                    git config --local user.email "169603024+wolfstarbot@users.noreply.github.com";
                    BOT_LOGIN="wolfstarbot";
                    BOT_EMAIL="169603024+wolfstarbot@users.noreply.github.com";
                    # Reuse a single fixed branch so re-runs update the existing PR
                    # instead of spawning a new one each time, but refuse to touch
                    # it if it wasn't created by this workflow, so we never clobber
                    # an unrelated collaborator branch/PR that happens to be named "i18n".
                    if git ls-remote --exit-code --heads origin i18n > /dev/null 2>&1; then
                      git fetch origin i18n;
                      REMOTE_AUTHOR="$(git log -1 --format='%ae' origin/i18n)";
                      if [ "$REMOTE_AUTHOR" != "$BOT_EMAIL" ]; then
                        echo "::error::Refusing to overwrite the 'i18n' branch: its latest commit was not authored by $BOT_LOGIN (found $REMOTE_AUTHOR)";
                        exit 1;
                      fi
                    fi
                    # Fail safely if an open PR with this head branch is not owned by the
                    # automation account, so we never silently retarget someone else's PR.
                    PR_AUTHOR="$(gh pr list --head i18n --state open --json author --jq '.[0].author.login // empty')";
                    if [ -n "$PR_AUTHOR" ] && [ "$PR_AUTHOR" != "$BOT_LOGIN" ]; then
                      echo "::error::Refusing to reuse the 'i18n' branch: its open PR is owned by $PR_AUTHOR, not $BOT_LOGIN";
                      exit 1;
                    fi
                    git checkout -B i18n;
                    git commit -sam "chore(i18n): update translations from Tolgee";
                    git push --force --set-upstream origin i18n;
                    if [ -z "$PR_AUTHOR" ]; then
                      gh pr create -t "chore(i18n): update translations from Tolgee" -b "*bleep bloop* I synced the translations from Tolgee" -B main -H i18n;
                    else
                      echo "An open PR for the i18n branch already exists, skipping PR creation";
                    fi
                  fi
