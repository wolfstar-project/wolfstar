name: Tolgee Translation Sync

on:
    workflow_dispatch:
    schedule:
        # Every day at 02:00 UTC
        - cron: '0 2 * * *'

concurrency:
    group: tolgee-sync
    cancel-in-progress: false

permissions: {}

jobs:
    SyncTranslations:
        name: Sync translations from Tolgee
        permissions:
            contents: read
        uses: wolfstar-project/.github/.github/workflows/reusable-tolgee-sync.yml@0a65e26dd292ea41e046e8d75ae681918a0ec046
        with:
            # `pnpm tolgee:pull` runs the CLI (config: .tolgeerc.cjs) and then
            # scripts/tolgee-pull-remap.ts, which remaps Tolgee language tags
            # (es, pt, zh-Hans, …) onto the Discord locale directories under
            # projects/bot/src/locales and merges the export onto the committed
            # files (en-US is never written).
            pull-command: pnpm tolgee:pull
            # projects/bot/tests/setup.ts boots #lib/setup, which needs the generated client;
            # the install skips lifecycle scripts, so generate it explicitly. Then a
            # structural gate on the merged tree: no nulls, no `name[0]` keys, no raw ICU
            # shells, placeholders consistent with en-US. A corrupt export fails the job
            # here instead of reaching a pull request.
            validate-command: |
                pnpm --filter wolfstar-database prisma:generate
                pnpm vitest run tests/languages
            paths: projects/bot/src/locales
        secrets:
            TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
            WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
