name: Update Phishing Links

on:
    workflow_dispatch:
    schedule:
        - cron: '0 0 * * *'

jobs:
    UpdatePhishingLinks:
        name: Update the phishing links
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Project
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.WOLFSTAR_TOKEN }}
            - uses: pnpm/action-setup@v6
              name: Install pnpm
              with:
                  run_install: false
            - name: Use Node.js v24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run the phishing links updater script
              run: pnpm scripts:phishing
            - name: Commit any changes and create a pull request
              env:
                  GITHUB_USER: github-actions[bot]
                  GITHUB_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add .;
                  if git diff-index --quiet HEAD --; then
                    echo "No changes to commit, exiting with code 0"
                    exit 0;
                  else
                    git remote set-url origin "https://${GITHUB_TOKEN}:x-oauth-basic@github.com/${GITHUB_REPOSITORY}.git";
                    git config --local user.email "${GITHUB_EMAIL}";
                    git config --local user.name "${GITHUB_USER}";
                    git checkout -b update-phishing/$(date +%F-%H-%M);
                    git commit -sam "refactor: update the phishing links";
                    git push --set-upstream origin $(git rev-parse --abbrev-ref HEAD)
                    gh pr create -t "refactor: update the phishing links" -b "*bleep bloop* I updated the phishing links file" -B main;
                  fi
