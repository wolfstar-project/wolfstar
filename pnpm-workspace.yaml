packages:
    - 'projects/*'

allowBuilds:
    bufferutil: false
    'zlib-sync': false
    '@prisma/client': true
    '@prisma/engines': true
    prisma: true
    esbuild: false
    msgpackr-extract: false
    workerd: false

overrides:
    # shared-http-pieces 2.0.7 pins plugin-i18next 2.0.3, whose peer range stops at
    # http-framework ^3: dedupe it onto the bot's copy, which accepts ^5.
    '@wolfstar/shared-http-pieces>@wolfstar/plugin-i18next': ^2.1.1
    ansi-regex: ^5.0.1
    discord-api-types: ^0.38.56
    minimist: ^1.2.8
    vite: ^8.3.2
    # prisma-orm-extension-typed-json is only published for rc.5: run it on the rc.13 packs the contract needs.
    prisma-orm-extension-typed-json>@prisma/orm-family-sql: 8.0.0-rc.13
    prisma-orm-extension-typed-json>@prisma/orm-framework: 8.0.0-rc.13
    '@prisma/orm-target-postgres': 8.0.0-rc.13

dedupePeers: true

shellEmulator: true

# A release waits a day before an install picks it, so a compromised one has the time to be noticed. The packages of
# the organization are released and taken the same day.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - '@wolfstar/*'

# Moved here from .npmrc: since pnpm 11 only auth and registry settings are read
# from .npmrc, everything else must live in this file in camelCase.
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
patchedDependencies:
    prisma-orm-extension-typed-json: patches/prisma-orm-extension-typed-json.patch
