allowBuilds:
    '@prisma/client': true
    '@prisma/engines': true
    '@tailwindcss/oxide': true
    better-sqlite3: true
    bufferutil: false
    esbuild: true
    prisma: true
    sharp@0.34.5: true
    workerd: true
    zlib-sync: false

overrides:
    ansi-regex: ^5.0.1
    discord-api-types: ^0.38.34
    minimist: ^1.2.8

dedupePeers: true

# Moved from .npmrc: pnpm >= 11 only reads auth/registry settings there.
shamefullyHoist: true
hoistPattern:
    - '*prisma*'
ignoreWorkspaceRootCheck: true

shellEmulator: true

# Never auto-install from `pnpm run`/`pnpm start`: the production image has no writable store,
# so a start command like Railway's `pnpm start` would crash with EACCES on /var/cache/pnpm.
verifyDepsBeforeRun: false

# Delay installs of very new releases by 24 hours (1440 minutes) as a supply-chain safety buffer.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - '@sentry/conventions'
    - '@sentry/core'
    - '@sentry/node'
    - '@sentry/node-core'
    - '@sentry/opentelemetry'
    - '@sentry/server-utils'
    - evlog
